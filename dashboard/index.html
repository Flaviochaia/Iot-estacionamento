<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Parking – Dashboard</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1b2430; --muted: #6b7686;
    --border: #e2e7ee; --free: #1f9d55; --busy: #d64545; --warn: #d98e04;
    --free-bg: #e6f6ec; --busy-bg: #fbeaea;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171e; --card: #1b222c; --text: #e8edf3; --muted: #93a0b2;
      --border: #2b3441; --free: #3ecf79; --busy: #f07178; --warn: #f0b429;
      --free-bg: #173425; --busy-bg: #3a1d20;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 16px 20px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .conn { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
  .dot.on { background: var(--free); } .dot.off { background: var(--busy); }
  main { padding: 0 20px 24px; max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .kpi .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 2.2rem; font-weight: 700; margin-top: 4px; }
  .kpi.free .value { color: var(--free); } .kpi.busy .value { color: var(--busy); }
  .spots { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .spot { border-radius: 10px; padding: 14px; text-align: center; border: 2px solid; }
  .spot.free { background: var(--free-bg); border-color: var(--free); }
  .spot.busy { background: var(--busy-bg); border-color: var(--busy); }
  .spot .code { font-size: 1.4rem; font-weight: 700; }
  .spot .state { font-size: .85rem; margin-top: 2px; }
  .spot .since { font-size: .72rem; color: var(--muted); margin-top: 6px; }
  .banner { display: none; padding: 12px 16px; border-radius: 10px; font-weight: 600;
            background: var(--busy-bg); color: var(--busy); border: 1px solid var(--busy); }
  .banner.show { display: block; }
  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .scroll { overflow-x: auto; max-height: 340px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  .tag { padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .tag.ENTRY { background: var(--busy-bg); color: var(--busy); }
  .tag.EXIT { background: var(--free-bg); color: var(--free); }
  .tag.FULL_ALERT { background: var(--warn); color: #000; }
  .invalid { color: var(--warn); font-weight: 600; }
  .empty { color: var(--muted); padding: 12px 0; font-size: .85rem; }
  @media (max-width: 760px) { .tables { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🅿️ Smart Parking</h1>
  <div class="conn"><span id="dot" class="dot"></span><span id="connText">a ligar…</span></div>
</header>

<main>
  <div id="banner" class="banner">⚠️ Parque cheio – cancela fechada</div>

  <section class="cards">
    <div class="card kpi"><div class="label">Total de lugares</div><div class="value" id="total">–</div></div>
    <div class="card kpi busy"><div class="label">Ocupados</div><div class="value" id="occupied">–</div></div>
    <div class="card kpi free"><div class="label">Disponíveis</div><div class="value" id="free">–</div></div>
  </section>

  <section class="card">
    <h2>Estado dos lugares (tempo real)</h2>
    <div class="spots" id="spots"></div>
  </section>

  <section class="tables">
    <div class="card">
      <h2>Histórico de utilização</h2>
      <div class="scroll"><table>
        <thead><tr><th>Data e hora</th><th>Lugar</th><th>Evento</th></tr></thead>
        <tbody id="events"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h2>Últimas leituras dos sensores</h2>
      <div class="scroll"><table>
        <thead><tr><th>Data e hora</th><th>Lugar</th><th>Distância</th></tr></thead>
        <tbody id="readings"></tbody>
      </table></div>
    </div>
  </section>
</main>

<script>
  const POLL_MS = 2000;
  const $ = (id) => document.getElementById(id);

  // Escapa texto antes de inserir em HTML
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // A API pode devolver datas sem fuso: assume UTC e mostra na hora local
  function fmt(iso) {
    if (!iso) return "–";
    const hasTz = /(Z|[+-]\d\d:?\d\d)$/.test(iso);
    return new Date(hasTz ? iso : iso + "Z").toLocaleString("pt-PT");
  }

  const EVENT_LABEL = { ENTRY: "Entrada", EXIT: "Saída", FULL_ALERT: "Parque cheio" };

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  function setConn(ok) {
    $("dot").className = "dot " + (ok ? "on" : "off");
    $("connText").textContent = ok
      ? "ligado · actualizado " + new Date().toLocaleTimeString("pt-PT")
      : "sem ligação à API";
  }

  function renderStatus(s) {
    $("total").textContent = s.total;
    $("occupied").textContent = s.occupied;
    $("free").textContent = s.free;
    $("banner").classList.toggle("show", s.total > 0 && s.free === 0);
    $("spots").innerHTML = s.spots.map((p) => `
      <div class="spot ${p.occupied ? "busy" : "free"}">
        <div class="code">${esc(p.code)}</div>
        <div class="state">${p.occupied ? "Ocupado" : "Livre"}</div>
        <div class="since">${esc(fmt(p.updatedAt))}</div>
      </div>`).join("");
  }

  function renderEvents(list) {
    $("events").innerHTML = list.length ? list.map((e) => `
      <tr><td>${esc(fmt(e.createdAt))}</td>
          <td>${e.spot ? esc(e.spot.code) : "–"}</td>
          <td><span class="tag ${esc(e.type)}">${esc(EVENT_LABEL[e.type] || e.type)}</span></td></tr>`).join("")
      : `<tr><td colspan="3" class="empty">Ainda sem eventos.</td></tr>`;
  }

  function renderReadings(list) {
    $("readings").innerHTML = list.length ? list.map((r) => `
      <tr><td>${esc(fmt(r.createdAt))}</td>
          <td>${r.spot ? esc(r.spot.code) : "–"}</td>
          <td>${esc(r.distanceCm.toFixed(1))} cm${r.valid ? "" : ' <span class="invalid">· inválida</span>'}</td></tr>`).join("")
      : `<tr><td colspan="3" class="empty">Ainda sem leituras.</td></tr>`;
  }

  async function refresh() {
    try {
      const [s, e, r] = await Promise.all([
        getJSON("/api/status"),
        getJSON("/api/events?limit=30"),
        getJSON("/api/readings?limit=30"),
      ]);
      renderStatus(s); renderEvents(e); renderReadings(r);
      setConn(true);
    } catch (err) {
      setConn(false);   // a API caiu: mantém o último estado e volta a tentar
    }
  }

  refresh();
  setInterval(refresh, POLL_MS);
</script>
</body>
</html>
